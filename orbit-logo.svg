<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ORBIT DEVELOPMENT — Building Digital Worlds">
  <defs>
    <!-- Backdrop -->
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#0b0a1e"/>
      <stop offset="45%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="atmo" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#3a2b8c" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1b1f6e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring gradients -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#1e6bff"/>
      <stop offset="45%" stop-color="#5a2bff"/>
      <stop offset="100%" stop-color="#b23bff"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#8a2bff"/>
      <stop offset="100%" stop-color="#1e6bff"/>
    </linearGradient>

    <!-- Metal head -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="18%" stop-color="#7be04f"/>
      <stop offset="55%" stop-color="#3fa32a"/>
      <stop offset="100%" stop-color="#1c5c15"/>
    </linearGradient>
    <linearGradient id="headRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37c6ff"/>
      <stop offset="100%" stop-color="#a03bff"/>
    </linearGradient>

    <!-- Chrome text -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#c7ced6"/>
      <stop offset="52%" stop-color="#7c828c"/>
      <stop offset="53%" stop-color="#eef2f6"/>
      <stop offset="100%" stop-color="#9aa1ab"/>
    </linearGradient>
    <linearGradient id="devGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f7bff"/>
      <stop offset="100%" stop-color="#b23bff"/>
    </linearGradient>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a5bff"/>
      <stop offset="100%" stop-color="#2a1b6e"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#atmo)"/>

  <!-- Stars -->
  <g fill="#cfe0ff">
    <circle cx="230" cy="230" r="3.5"/><circle cx="300" cy="410" r="2"/>
    <circle cx="180" cy="520" r="2.5"/><circle cx="950" cy="250" r="3"/>
    <circle cx="1010" cy="470" r="2"/><circle cx="880" cy="150" r="2.2"/>
    <circle cx="420" cy="180" r="2"/><circle cx="760" cy="200" r="2.4"/>
    <circle cx="990" cy="620" r="2.2"/><circle cx="210" cy="700" r="2"/>
  </g>
  <g fill="#ffffff">
    <path d="M600 120 l6 22 22 6 -22 6 -6 22 -6-22 -22-6 22-6z" opacity=".9"/>
    <path d="M905 560 l5 16 16 5 -16 5 -5 16 -5-16 -16-5 16-5z" opacity=".8"/>
    <path d="M300 300 l4 12 12 4 -12 4 -4 12 -4-12 -12-4 12-4z" opacity=".7"/>
  </g>

  <!-- ===== EMBLEM (self-contained, centered ~600,430) ===== -->
  <g transform="translate(600 430)">

    <!-- Back half of orbital ring -->
    <g filter="url(#glow)">
      <ellipse cx="0" cy="0" rx="330" ry="120" fill="none" stroke="url(#ringGrad)"
               stroke-width="26" transform="rotate(-18)" stroke-linecap="round"
               stroke-dasharray="620 900" stroke-dashoffset="0"/>
    </g>

    <!-- Split C-orbit shells behind head -->
    <g transform="rotate(0)">
      <path d="M -60 -250 A 250 250 0 0 0 -250 60"
            fill="none" stroke="url(#ringGrad2)" stroke-width="52" stroke-linecap="round"/>
      <path d="M 60 -250 A 250 250 0 0 1 250 60"
            fill="none" stroke="url(#ringGrad)" stroke-width="52" stroke-linecap="round"/>
      <path d="M -215 150 A 250 250 0 0 0 -30 245"
            fill="none" stroke="url(#ringGrad2)" stroke-width="52" stroke-linecap="round"/>
      <path d="M 215 150 A 250 250 0 0 1 40 245"
            fill="none" stroke="url(#ringGrad)" stroke-width="52" stroke-linecap="round"/>
    </g>

    <!-- Robot / Android head -->
    <g>
      <!-- head glow base -->
      <path d="M -150 30 A 150 150 0 0 1 150 30 L 150 120 A 30 30 0 0 1 120 150 L -120 150 A 30 30 0 0 1 -150 120 Z"
            fill="url(#metal)" stroke="url(#headRim)" stroke-width="7"/>
      <!-- dome sheen -->
      <path d="M -120 -20 A 120 120 0 0 1 120 -20" fill="none" stroke="#eaffea" stroke-width="10" opacity=".55" stroke-linecap="round"/>
      <!-- antennas -->
      <g stroke="url(#headRim)" stroke-width="10" stroke-linecap="round">
        <line x1="-70" y1="-70" x2="-100" y2="-118"/>
        <line x1="70" y1="-70" x2="100" y2="-118"/>
      </g>
      <circle cx="-100" cy="-122" r="9" fill="#37c6ff" filter="url(#glow)"/>
      <circle cx="100" cy="-122" r="9" fill="#b23bff" filter="url(#glow)"/>
      <!-- eyes -->
      <circle cx="-58" cy="55" r="20" fill="#ffffff" filter="url(#glow)"/>
      <circle cx="58" cy="55" r="20" fill="#ffffff" filter="url(#glow)"/>
      <circle cx="-58" cy="55" r="9" fill="#0c3d55"/>
      <circle cx="58" cy="55" r="9" fill="#0c3d55"/>
      <!-- HUD brow / mech detail -->
      <line x1="-95" y1="105" x2="-30" y2="105" stroke="#0d2b0a" stroke-width="6" opacity=".5" stroke-linecap="round"/>
      <line x1="30" y1="105" x2="95" y2="105" stroke="#0d2b0a" stroke-width="6" opacity=".5" stroke-linecap="round"/>
      <circle cx="0" cy="125" r="6" fill="#0d2b0a" opacity=".5"/>
    </g>

    <!-- Front half of orbital ring (over head) -->
    <g filter="url(#glow)">
      <path d="M -335 40 A 335 122 -18 0 0 305 -70"
            fill="none" stroke="url(#ringGrad)" stroke-width="26"
            stroke-linecap="round" transform="rotate(-18)"/>
    </g>

    <!-- Planet / moon riding the ring -->
    <g transform="translate(300 -120)">
      <circle r="34" fill="url(#planetGrad)" stroke="#8a7bff" stroke-width="2"/>
      <ellipse rx="52" ry="14" fill="none" stroke="#b23bff" stroke-width="6" transform="rotate(-18)" opacity=".9"/>
      <circle cx="-10" cy="-8" r="6" fill="#3b2b8c" opacity=".7"/>
    </g>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g text-anchor="middle" font-family="'Arial Black','Segoe UI',Helvetica,sans-serif">
    <!-- O with orbital ring accent -->
    <ellipse cx="337" cy="850" rx="78" ry="30" fill="none" stroke="url(#ringGrad)" stroke-width="12" transform="rotate(-18 337 850)"/>
    <text x="605" y="905" font-size="220" font-weight="900" letter-spacing="6"
          fill="url(#chrome)" stroke="#20242c" stroke-width="2">ORBIT</text>
  </g>

  <text x="600" y="985" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="66" font-weight="700" letter-spacing="26" fill="url(#devGrad)">DEVELOPMENT</text>

  <!-- Tagline -->
  <g transform="translate(600 1045)">
    <line x1="-250" y1="0" x2="-140" y2="0" stroke="url(#devGrad)" stroke-width="3"/>
    <line x1="140" y1="0" x2="250" y2="0" stroke="url(#devGrad)" stroke-width="3"/>
    <polygon points="-135,-7 -120,0 -135,7" fill="#8a2bff"/>
    <polygon points="135,-7 120,0 135,7" fill="#2f7bff"/>
  </g>
  <text x="600" y="1055" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="30" font-weight="500" letter-spacing="18" fill="#d7dce3">BUILDING DIGITAL WORLDS</text>
</svg>
